name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  site:
    name: Site (format, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bunx prettier --check .
      - run: bunx astro check
      - run: bun run build

  pipeline:
    name: Data pipeline (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m py_compile build_dataset.py analyze.py

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t eleicoes-2026 .
